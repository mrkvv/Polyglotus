services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: polyglotus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./backend/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - polyglotus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  adminer:
    image: adminer:5
    container_name: polyglotus-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - polyglotus-network


  redis:
    image: redis:8.0-alpine
    container_name: polyglotus-redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - polyglotus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "0.8"
        reservations:
          memory: "256M"
          cpus: "0.1"


  ollama:
    image: ollama/ollama:0.40.14
    container_name: polyglotus-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 1
    profiles: [ "llm" ]
    healthcheck:
      test: [ "CMD-SHELL", "ollama list > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - polyglotus-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:0.40.14
    container_name: polyglotus-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Pulling ${OLLAMA_MODEL} model..."
        ollama pull ${OLLAMA_MODEL}
        echo "Model pulled successfully."
    networks:
      - polyglotus-network
    profiles: [ "llm" ]
    restart: "no"


  user-service:
    build: ./backend/user-service
    container_name: polyglotus-user-service
    ports:
      - "${USER_SERVICE_PORT}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyglotus-network
    deploy:
      resources:
        limits:
          memory: "768M"
          cpus: "0.5"
        reservations:
          memory: "384M"
          cpus: "0.3"

  dictionary-service:
    build: ./backend/dictionary-service
    container_name: polyglotus-dictionary-service
    ports:
      - "${DICTIONARY_SERVICE_PORT}:8083"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyglotus-network
    deploy:
      resources:
        limits:
          memory: "768M"
          cpus: "0.5"
        reservations:
          memory: "384M"
          cpus: "0.3"

  training-service:
    build: ./backend/training-service
    container_name: polyglotus-training-service
    ports:
      - "${TRAINING_SERVICE_PORT}:8084"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyglotus-network
    deploy:
      resources:
        limits:
          memory: "768M"
          cpus: "0.5"
        reservations:
          memory: "384M"
          cpus: "0.3"

  ai-service:
    build: ./backend/ai-service
    container_name: polyglotus-ai-service
    ports:
      - "${AI_SERVICE_PORT}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      embedder-service:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDER_SERVICE_URL: http://embedder-service:8086
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    profiles: [ "llm" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyglotus-network
    deploy:
      resources:
        limits:
          memory: "768M"
          cpus: "0.5"
        reservations:
          memory: "384M"
          cpus: "0.3"

  embedder-service:
    build: ./backend/embedder-service
    container_name: polyglotus-embedder-service
    ports:
      - "${EMBEDDER_SERVICE_PORT}:8086"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    profiles: [ "llm" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyglotus-network
    deploy:
      resources:
        limits:
          memory: "768M"
          cpus: "0.5"
        reservations:
          memory: "384M"
          cpus: "0.3"

  api-gateway:
    build: ./backend/api-gateway
    container_name: polyglotus-api-gateway
    ports:
      - "${GATEWAY_PORT}:8000"
    depends_on:
      user-service:
        condition: service_healthy
      dictionary-service:
        condition: service_healthy
      training-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      USER_SERVICE_URL: http://user-service:8082
      DICTIONARY_SERVICE_URL: http://dictionary-service:8083
      TRAINING_SERVICE_URL: http://training-service:8084
      AI_SERVICE_URL: http://ai-service:8085
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      GATEWAY_ALLOWED_ORIGIN: ${GATEWAY_ALLOWED_ORIGIN}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polyglotus-network
    deploy:
      resources:
        limits:
          memory: "768M"
          cpus: "0.5"
        reservations:
          memory: "384M"
          cpus: "0.3"

volumes:
  pg_data:
  redis_data:
  ollama_data:

networks:
  polyglotus-network:
    name: polyglotus-network
    driver: bridge
