services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: polyglotus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./backend/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - polyglotus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  adminer:
    image: adminer:5
    container_name: polyglotus-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - polyglotus-network


  redis:
    image: redis:8.0-alpine
    container_name: polyglotus-redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - polyglotus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "0.8"
        reservations:
          memory: "256M"
          cpus: "0.1"


  user-service:
    build: ./backend/user-service
    container_name: polyglotus-user-service
    ports:
      - "${USER_SERVICE_PORT}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI}
    networks:
      - polyglotus-network
    deploy:
      resources:
        limits:
          memory: "768M"
          cpus: "0.5"
        reservations:
          memory: "384M"
          cpus: "0.3"

volumes:
  pg_data:
  redis_data:

networks:
  polyglotus-network:
    name: polyglotus-network
    driver: bridge
