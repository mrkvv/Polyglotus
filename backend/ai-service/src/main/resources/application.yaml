spring:
  application:
    name: ai-service

  ai:
    ollama:
      base-url: ${OLLAMA_HOST:http://localhost:${OLLAMA_PORT:11434}}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:3b}
          temperature: 0.7

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:testdb}
    username: ${POSTGRES_USER:testuser}
    password: ${POSTGRES_PASSWORD:testpass}
    driver: org.postgresql.Driver

server:
  port: 8085

embedder:
  service:
    url: ${EMBEDDER_SERVICE_URL:http://localhost:8086}
