spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

server:
  port: 8000

cors:
  allowed-origin: ${GATEWAY_ALLOWED_ORIGIN:http://localhost:3000}

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

dictionary:
  service:
    url: ${DICTIONARY_SERVICE_URL:http://localhost:8083}

training:
  service:
    url: ${TRAINING_SERVICE_URL:http://localhost:8084}
